name: scientific-tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.24"
      - run: uv python install 3.12.7
      - run: uv sync --locked --extra dev --python 3.12.7
      - run: make test
      - run: make smoke
